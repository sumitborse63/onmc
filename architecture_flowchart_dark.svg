<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1450" width="100%" height="100%" style="background:#111317; font-family:'JetBrains Mono', 'Fira Code', 'Courier New', monospace;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#161920"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- 1. CPSE DATA SOURCES -->
  <g transform="translate(175, 40)">
    <rect width="500" height="90" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="32" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold" letter-spacing="1">CPSE DATA SOURCES</text>
    <text x="250" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">SAP/ERP  |  PDFs  |  Images</text>
    <text x="250" y="74" text-anchor="middle" fill="#94a3b8" font-size="12">Procurement Data</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="425" y1="130" x2="425" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. CPSE EDGE / INGESTION -->
  <g transform="translate(175, 170)">
    <rect width="500" height="90" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="32" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold" letter-spacing="1">CPSE EDGE / INGESTION</text>
    <text x="250" y="55" text-anchor="middle" fill="#38bdf8" font-size="12">Secure Extraction (Privacy Redaction)</text>
    <text x="250" y="74" text-anchor="middle" fill="#94a3b8" font-size="12">OCR + Data Validation</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="425" y1="260" x2="425" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. DATA STANDARDIZATION -->
  <g transform="translate(175, 300)">
    <rect width="500" height="110" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="32" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold" letter-spacing="1">DATA STANDARDIZATION</text>
    <text x="250" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">Cleaning  |  NLP Tokenization</text>
    <text x="250" y="76" text-anchor="middle" fill="#94a3b8" font-size="12">UoM Normalization (2" -> 50mm)</text>
    <text x="250" y="96" text-anchor="middle" fill="#94a3b8" font-size="12">Domain Attribute Extraction</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="425" y1="410" x2="425" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. AI + AGENTIC AI ENGINE -->
  <g transform="translate(175, 450)">
    <rect width="500" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="30" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold" letter-spacing="1">AI + AGENTIC AI ENGINE</text>
    <text x="40" y="60" fill="#e2e8f0" font-size="12">• Material Matching Agent (Agent 1)</text>
    <text x="40" y="82" fill="#94a3b8" font-size="12">• Vector / Semantic Cosine Similarity (BGE)</text>
    <text x="40" y="104" fill="#94a3b8" font-size="12">• Technical Attribute Comparison (Grade/Class/Dim)</text>
    <text x="40" y="126" fill="#94a3b8" font-size="12">• Duplicate Detection &amp; Cluster Analytics</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="425" y1="600" x2="425" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. CONFIDENCE & RULE ENGINE -->
  <g transform="translate(175, 640)">
    <rect width="500" height="60" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="35" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold" letter-spacing="1">CONFIDENCE &amp; RULE ENGINE</text>
  </g>

  <!-- Split Branch Lines -->
  <path d="M 425 700 L 425 730 M 235 730 L 615 730 M 235 730 L 235 760 M 425 730 L 425 760 M 615 730 L 615 760" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- 6A. GREEN TIER -->
  <g transform="translate(145, 760)">
    <rect width="180" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glowGreen)"/>
    <text x="90" y="28" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">🟢 GREEN (>=95%)</text>
    <text x="90" y="50" text-anchor="middle" fill="#a7f3d0" font-size="11">High Match</text>
  </g>

  <!-- 6B. YELLOW TIER -->
  <g transform="translate(335, 760)">
    <rect width="180" height="70" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" filter="url(#glowYellow)"/>
    <text x="90" y="28" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">🟡 YELLOW (70-94%)</text>
    <text x="90" y="50" text-anchor="middle" fill="#fde68a" font-size="11">Human Review</text>
  </g>

  <!-- 6C. RED TIER -->
  <g transform="translate(525, 760)">
    <rect width="180" height="70" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)"/>
    <text x="90" y="28" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">🔴 RED (&lt;70%)</text>
    <text x="90" y="50" text-anchor="middle" fill="#fecaca" font-size="11">New Material</text>
  </g>

  <!-- Yellow -> Engineering Review -->
  <line x1="425" y1="830" x2="425" y2="870" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Engineering Expert Review Box -->
  <g transform="translate(325, 870)">
    <rect width="200" height="70" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Engineering</text>
    <text x="100" y="48" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Expert Review</text>
  </g>

  <!-- Approve / Reject Paths from Review -->
  <!-- Green Line Down to Central Registry -->
  <line x1="235" y1="830" x2="235" y2="1010" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Review Approve Line (Straight Down) -->
  <line x1="390" y1="940" x2="390" y2="1010" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="345" y="960" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="375" y="974" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">APPROVE</text>

  <!-- Review Reject Line (Branches to Red) -->
  <path d="M 460 940 L 460 970 L 615 970 L 615 835" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="495" y="960" width="55" height="20" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="522" y="974" text-anchor="middle" fill="#f87171" font-size="9" font-weight="bold">REJECT</text>

  <!-- Red Line Down to Central Registry (New Master Generation) -->
  <line x1="615" y1="830" x2="615" y2="1010" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 7. COMMON NATIONAL MATERIAL CODE REGISTRY -->
  <g transform="translate(100, 1010)">
    <rect width="650" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="325" y="32" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold" letter-spacing="1">COMMON NATIONAL MATERIAL CODE (CNM-XXXXXX-XXX)</text>
    <text x="325" y="60" text-anchor="middle" fill="#f8fafc" font-size="13">+ NATIONAL MATERIAL REGISTRY (1:N BACKWARD MAPPING)</text>
    <text x="325" y="84" text-anchor="middle" fill="#94a3b8" font-size="12">+ CPSE LEGACY PART MAPPING &amp; SHA-256 CRYPTOGRAPHIC LEDGER</text>
  </g>

  <!-- Split Branch Lines to Outputs -->
  <path d="M 425 1120 L 425 1160 M 180 1160 L 670 1160 M 180 1160 L 180 1200 M 425 1160 L 425 1200 M 670 1160 L 670 1200" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- 8A. SAP/ERP Sync & Drift -->
  <g transform="translate(80, 1200)">
    <rect width="200" height="90" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">SAP/ERP Sync</text>
    <text x="100" y="52" text-anchor="middle" fill="#f43f5e" font-size="12">+ Drift Monitor</text>
    <text x="100" y="72" text-anchor="middle" fill="#94a3b8" font-size="10">(Agent 4 &amp; 5 BAPI)</text>
  </g>

  <!-- 8B. Smart Search -->
  <g transform="translate(325, 1200)">
    <rect width="200" height="90" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Smart Search &amp;</text>
    <text x="100" y="52" text-anchor="middle" fill="#38bdf8" font-size="12">Voice Explorer</text>
    <text x="100" y="72" text-anchor="middle" fill="#94a3b8" font-size="10">(1:N Query Engine)</text>
  </g>

  <!-- 8C. Procurement & Savings -->
  <g transform="translate(570, 1200)">
    <rect width="200" height="90" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">Procurement &amp;</text>
    <text x="100" y="52" text-anchor="middle" fill="#10b981" font-size="12">Savings Analytics</text>
    <text x="100" y="72" text-anchor="middle" fill="#94a3b8" font-size="10">(MSEs Order 2012)</text>
  </g>
</svg>
